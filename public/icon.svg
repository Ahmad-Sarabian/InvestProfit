<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>

  <!-- Chart Grid Lines -->
  <line x1="80" y1="380" x2="432" y2="380" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="290" x2="432" y2="290" stroke="#374151" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5"/>
  <line x1="80" y1="200" x2="432" y2="200" stroke="#374151" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- Chart Bars -->
  <rect x="100" y="290" width="56" height="90" rx="8" fill="url(#bar1)"/>
  <rect x="184" y="225" width="56" height="155" rx="8" fill="url(#bar2)"/>
  <rect x="268" y="160" width="56" height="220" rx="8" fill="url(#bar3)"/>
  <rect x="352" y="110" width="56" height="270" rx="8" fill="url(#bar4)"/>

  <!-- Compound Growth Trend Curve -->
  <path d="M 120 300 Q 230 240, 375 105" fill="none" stroke="url(#lineGrad)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Arrow Head -->
  <polygon points="375,90 395,120 365,115" fill="#fbbf24" filter="url(#glow)"/>

  <!-- Growth Sparkle / Badge -->
  <circle cx="120" cy="140" r="32" fill="#fbbf24" opacity="0.15"/>
  <circle cx="120" cy="140" r="22" fill="#f59e0b"/>
  <text x="120" y="148" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="sans-serif">٪</text>
</svg>